<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podnikový informační systém — Klientský Modul</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 2rem 0; margin: 0; }
        .container { width: 100%; padding: 0 1.5rem; margin: 0 auto; max-width: 1240px; box-sizing: border-box; }
        .grid { display: flex; flex-direction: column; gap: 2rem; }
        @media (min-width: 992px) { .grid { flex-direction: row; } .col-main { flex: 0 0 65%; max-width: 65%; } .col-side { flex: 0 0 35%; max-width: 35%; } }
        .card { background-color: #fff; border: 1px solid #e5e7eb; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 2rem; overflow: hidden; }
        .card-header { padding: 1rem 1.5rem; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; color: #fff; }
        .header-projects { background-color: #1f2937; } .header-people { background-color: #374151; }
        .header-form-project { background-color: #2563eb; } .header-form-person { background-color: #16a34a; }
        .card-body { padding: 1.5rem; }
        .card-edit-mode { border-color: #ea580c !important; box-shadow: 0 10px 15px -3px rgba(234,88,12,0.15) !important; }
        .header-edit-mode { background-color: #ea580c !important; }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        .custom-table th { background-color: #f9fafb; color: #4b5563; font-weight: 600; padding: 0.75rem 1rem; border-bottom: 2px solid #e5e7eb; text-transform: uppercase; font-size: 0.75rem; }
        .custom-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #edf2f7; vertical-align: top; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.25rem; font-weight: 600; color: #374151; font-size: 0.9rem; }
        .form-control { display: block; width: 100%; padding: 0.5rem 0.75rem; font-size: 0.95rem; color: #1f2937; background-color: #fff; border: 1px solid #d1d5db; border-radius: 0.375rem; box-sizing: border-box; }
        .filter-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .filter-row .form-group { flex: 1; margin-bottom: 0; }
        .btn { display: inline-block; font-weight: 600; text-align: center; padding: 0.5rem 1rem; font-size: 0.95rem; border-radius: 0.375rem; cursor: pointer; border: 1px solid transparent; width: 100%; box-sizing: border-box; transition: all 0.15s ease; }
        .btn-primary { color: #fff; background-color: #2563eb; } .btn-success { color: #fff; background-color: #16a34a; } .btn-secondary { color: #374151; background-color: #e5e7eb; margin-top: 0.5rem; }
        .btn-sm { padding: 0.2rem 0.4rem; font-size: 0.8rem; border-radius: 0.25rem; width: auto; display: inline-block; margin-right: 0.25rem; text-decoration: none; cursor: pointer; }
        .btn-danger-sm { color: #fff; background-color: #dc2626; } .btn-warning-sm { color: #1f2937; background-color: #f59e0b; }
        .badge { display: inline-flex; padding: 0.2rem 0.5rem; font-size: 0.75rem; font-weight: 700; border-radius: 9999px; margin-right: 0.25rem; }
        .badge-status { background-color: #e0f2fe; color: #0369a1; } .badge-person { background-color: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; margin-right: 0.375rem; margin-bottom: 0.375rem; } .badge-role { background-color: #f0fdf4; color: #166534; }
        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; }
        .pagination-btn { width: auto; padding: 0.3rem 0.6rem; font-size: 0.85rem; background-color: #fff; border: 1px solid #d1d5db; }
        .pagination-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .alert-danger-box { padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #fecaca; border-radius: 0.375rem; color: #991b1b; background-color: #fef2f2; font-size: 0.9rem; font-weight: 600; display: none; }
        .text-muted { color: #6b7280; font-size: 0.85rem; } .font-bold { font-weight: 700; }
        .project-title { font-weight: 700; color: #111827; margin: 0; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; margin-bottom:0;">🏢 Podnikový informační systém</h1>
        <p style="text-align:center; color:#6b7280; margin-bottom:2rem;">Klientská full-stack architektura (Oddělené REST API & Frontend)</p>

        <div class="grid">
            <!-- LEVÝ SLOUPEC: PROJEKTY -->
            <div class="col-main">
                <div class="card">
                    <div class="card-header header-projects"><span>📁 Přehled projektů</span></div>
                    <div class="card-body">
                        <div class="filter-row">
                            <div class="form-group">
                                <label class="form-label">🔍 Vyhledat v projektech</label>
                                <input type="text" id="search-projects-input" class="form-control" placeholder="Název, popis..." oninput="filtrZmenaProjektu()">
                            </div>
                            <div class="form-group">
                                <label class="form-label">📌 Filtr podle stavu</label>
                                <select id="filter-project-status" class="form-control" onchange="filtrZmenaProjektu()">
                                    <option value="">-- Všechny stavy --</option>
                                    <option value="Příprava">Příprava</option>
                                    <option value="V realizaci">V realizaci</option>
                                    <option value="Pozastaven">Pozastaven</option>
                                    <option value="Dokončen">Dokončen</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="custom-table">
                                <thead><tr><th>Projekt</th><th>Harmonogram</th><th>Stav</th><th>Tým</th><th>Akce</th></tr></thead>
                                <tbody id="projects-table-body"></tbody>
                            </table>
                        </div>
                        <div class="pagination-container">
                            <button id="btn-project-prev" class="btn pagination-btn" onclick="zmenStrankuProjektu(-1)">◀ Predchozi</button>
                            <span id="info-project-page" class="text-muted">Stránka 1</span>
                            <button id="btn-project-next" class="btn pagination-btn" onclick="zmenStrankuProjektu(1)">Dalsi ▶</button>
                        </div>
                    </div>
                </div>

                <div class="card" id="karta-projektu-form">
                    <div class="card-header header-form-project" id="hlavicka-projektu-form"><h5 id="nadpis-projektu-form" style="margin:0;">➕ Nový projekt</h5></div>
                    <div class="card-body">
                        <div class="alert-danger-box" id="error-project-box"></div>
                        <form id="projekt-html-form" onsubmit="ulozProjekt(event)">
                            <input type="hidden" id="form-projekt-id" value="">
                            <div class="form-group"><label class="form-label">Název</label><input type="text" id="form-projekt-nazev" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Popis</label><textarea id="form-projekt-popis" class="form-control" rows="2"></textarea></div>
                            <div class="form-group"><label class="form-label">Začátek</label><input type="date" id="form-projekt-start" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Konec</label><input type="date" id="form-projekt-end" class="form-control"></div>

                            <!-- UPRAVENO: Stav projektu je nyní bezpečný select box -->
                            <div class="form-group">
                                <label class="form-label">Stav projektu</label>
                                <select id="form-projekt-stav" class="form-control" required>
                                    <option value="Příprava">Příprava</option>
                                    <option value="V realizaci">V realizaci</option>
                                    <option value="Pozastaven">Pozastaven</option>
                                    <option value="Dokončen">Dokončen</option>
                                </select>
                            </div>

                            <div class="form-group"><label class="form-label">Tým (Ctrl + klik)</label><select id="form-projekt-clenove" class="form-control" multiple style="height:100px;"></select></div>
                            <button type="submit" class="btn btn-primary" id="btn-submit-projekt">Uložit projekt</button>
                            <button type="button" class="btn btn-secondary" id="btn-reset-projekt" onclick="vynulujProjektFormular()" style="display:none;">Zrušit</button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- PRAVÝ SLOUPEC: OSOBY -->
            <div class="col-side">
                <div class="card">
                    <div class="card-header header-people"><span>👥 Registr pracovníků</span></div>
                    <div class="card-body">
                        <!-- Filtr a vyhledávání osob vedle sebe -->
                        <div class="filter-row">
                            <div class="form-group">
                                <label class="form-label">🔍 Vyhledat pracovníka</label>
                                <input type="text" id="search-people-input" class="form-control" placeholder="Jméno, email..." oninput="filtrZmenaOsob()">
                            </div>
                            <div class="form-group">
                                <label class="form-label">💼 Filtr podle pozice</label>
                                <!-- Vyčištěný select box, který JavaScript naplní dynamicky z API -->
                                <select id="filter-person-role" class="form-control" onchange="filtrZmenaOsob()">
                                    <option value="">-- Všechny pozice --</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="custom-table">
                                <thead><tr><th>Jméno</th><th>Pozice</th><th>Akce</th></tr></thead>
                                <tbody id="people-table-body"></tbody>
                            </table>
                        </div>
                        <div class="pagination-container">
                            <button id="btn-person-prev" class="btn pagination-btn" onclick="zmenStrankuOsob(-1)">◀</button>
                            <span id="info-person-page" class="text-muted">Stránka 1</span>
                            <button id="btn-person-next" class="btn pagination-btn" onclick="zmenStrankuOsob(1)">▶</button>
                        </div>
                    </div>
                </div>

                <div class="card" id="karta-osoby-form">
                    <div class="card-header header-form-person" id="hlavicka-osoby-form"><h5 id="nadpis-osoby-form" style="margin:0;">➕ Nová osoba</h5></div>
                    <div class="card-body">
                        <div class="alert-danger-box" id="error-person-box"></div>
                        <form id="osoba-html-form" onsubmit="ulozOsobu(event)">
                            <input type="hidden" id="form-osoba-id" value="">
                            <div class="form-group"><label class="form-label">Jméno</label><input type="text" id="form-osoba-jmeno" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Příjmení</label><input type="text" id="form-osoba-prijmeni" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Email</label><input type="email" id="form-osoba-email" class="form-control" required></div>
                            <div class="form-group"><label class="form-label">Pozice</label><input type="text" id="form-osoba-pozice" class="form-control" required></div>
                            <button type="submit" class="btn btn-success" id="btn-submit-osoba">Registrovat</button>
                            <button type="button" class="btn btn-secondary" id="btn-reset-osoba" onclick="vynulujOsobuFormular()" style="display:none;">Zrušit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let projektStranka = 1, projektHledanyText = "", projektVybranyStav = "";
        let osobaStranka = 1, osobaHledanyText = "", osobaVybranaPozice = "";

        document.addEventListener("DOMContentLoaded", () => {
            nactiProjekty();
            nactiOsoby();
            nactiVsechnyOsobyProSelect();
            nactiDynamickePozice(); // NOVÉ: Načte unikátní pozice z DB pro rozbalovací filtr
        });

        function nactiProjekty() {
            let url = `${API_BASE}/projekty/?page=${projektStranka}`;
            if (projektHledanyText) url += `&search=${encodeURIComponent(projektHledanyText)}`;
            if (projektVybranyStav) url += `&stav=${encodeURIComponent(projektVybranyStav)}`;
            fetch(url).then(res => res.json()).then(data => {
                vykresliTabulkuProjektu(data.results);
                document.getElementById("btn-project-prev").disabled = !data.previous;
                document.getElementById("btn-project-next").disabled = !data.next;
                document.getElementById("info-project-page").textContent = `Stránka ${projektStranka}`;
            }).catch(err => console.error(err));
        }

        function nactiOsoby() {
            let url = `${API_BASE}/osoby/?page=${osobaStranka}`;
            if (osobaHledanyText) url += `&search=${encodeURIComponent(osobaHledanyText)}`;
            if (osobaVybranaPozice) url += `&pozice=${encodeURIComponent(osobaVybranaPozice)}`;
            fetch(url).then(res => res.json()).then(data => {
                vykresliTabulkuOsob(data.results);
                document.getElementById("btn-person-prev").disabled = !data.previous;
                document.getElementById("btn-person-next").disabled = !data.next;
                document.getElementById("info-person-page").textContent = `Stránka ${osobaStranka}`;
            }).catch(err => console.error(err));
        }

        // NOVÉ: Asynchronní načtení unikátních pozic z API pro dynamický filtr
        function nactiDynamickePozice() {
            fetch(`${API_BASE}/osoby/pozice/`)
                .then(res => res.json())
                .then(pozice => {
                    const select = document.getElementById("filter-person-role");
                    // Ponecháme pouze výchozí volbu "Všechny pozice"
                    select.innerHTML = '<option value="">-- Všechny pozice --</option>';
                    pozice.forEach(p => {
                        const opt = document.createElement("option");
                        opt.value = p;
                        opt.textContent = p;
                        // Pokud zrovna podle této pozice filtrujeme, označíme ji jako vybranou
                        if (p === osobaVybranaPozice) opt.selected = true;
                        select.appendChild(opt);
                    });
                })
                .catch(err => console.error(err));
        }

        function nactiVsechnyOsobyProSelect() {
            fetch(`${API_BASE}/osoby/?page_size=100`).then(res => res.json()).then(data => {
                const lide = data.results ? data.results : data;
                const select = document.getElementById("form-projekt-clenove");
                select.innerHTML = "";
                lide.forEach(o => {
                    const opt = document.createElement("option"); opt.value = o.id;
                    opt.textContent = `${o.prijmeni} ${o.jmeno} — ${o.pozice}`; select.appendChild(opt);
                });
            }).catch(err => console.error(err));
        }

        function zmenStrankuProjektu(s) { projektStranka += s; nactiProjekty(); }
        function filtrZmenaProjektu() {
            projektHledanyText = document.getElementById("search-projects-input").value;
            projektVybranyStav = document.getElementById("filter-project-status").value;
            projektStranka = 1; nactiProjekty();
        }

        function zmenStrankuOsob(s) { osobaStranka += s; nactiOsoby(); }
        function filtrZmenaOsob() {
            osobaHledanyText = document.getElementById("search-people-input").value;
            osobaVybranaPozice = document.getElementById("filter-person-role").value;
            osobaStranka = 1; nactiOsoby();
        }

        function vykresliTabulkuOsob(osoby) {
            const tbody = document.getElementById("people-table-body"); tbody.innerHTML = "";
            if (!osoby || osoby.length === 0) { tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#6b7280;">Žádné záznamy</td></tr>`; return; }
            osoby.forEach(o => {
                const tr = document.createElement("tr"); tr.id = `osoba-row-${o.id}`;
                tr.innerHTML = `<td><span class="font-bold">${o.prijmeni} ${o.jmeno}</span><br><small class="text-muted">✉️ ${o.email}</small></td>
                    <td><span class="badge badge-role">${o.pozice}</span></td>
                    <td><button class="btn btn-sm btn-warning-sm" title="Upravit osobní kartu pracovníka" onclick="pripravUpravuOsoby(${JSON.stringify(o).replace(/"/g, '&quot;')})">✏️</button>
                        <button class="btn btn-sm btn-danger-sm" title="Trvale smazat pracovníka z registru" onclick="smazZaznam('osoby', ${o.id})">🗑️</button></td>`;
                tbody.appendChild(tr);
            });
        }

        function vykresliTabulkuProjektu(projekty) {
            const tbody = document.getElementById("projects-table-body"); tbody.innerHTML = "";
            if (!projekty || projekty.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#6b7280;">Žádné záznamy</td></tr>`; return; }
            projekty.forEach(p => {
                const fStart = p.start_date ? p.start_date.split("-").reverse().join(". ") : "";
                const fEnd = p.end_date ? p.end_date.split("-").reverse().join(". ") : "<span class='text-muted'>Neurčeno</span>";
                let b = ""; if (p.clenove_detail) p.clenove_detail.forEach(c => { b += `<span class="badge badge-person">👤 ${c.prijmeni} ${c.jmeno.slice(0,1)}.</span>`; });
                const tr = document.createElement("tr"); tr.id = `projekt-row-${p.id}`;
                tr.innerHTML = `<td><p class="project-title">${p.nazev}</p><span class="text-muted">${p.popis || "---"}</span></td>
                    <td><small class="font-bold">Od:</small> ${fStart}<br><small class="font-bold">Do:</small> ${fEnd}</td>
                    <td><span class="badge badge-status">${p.stav}</span></td><td>${b || "<span class='text-muted'>---</span>"}</td>
                    <td><button class="btn btn-sm btn-warning-sm" title="Upravit veškeré atributy projektu" onclick="pripravUpravuProjektu(${JSON.stringify(p).replace(/"/g, '&quot;')})">✏️</button>
                        <button class="btn btn-sm btn-danger-sm" title="Trvale odstranit projekt z evidence" onclick="smazZaznam('projekty', ${p.id})">🗑️</button></td>`;
                tbody.appendChild(tr);
            });
        }
        function smazZaznam(endpoint, id) {
            if (confirm("Opravdu smazat?")) {
                fetch(`${API_BASE}/${endpoint}/${id}/`, { method: "DELETE" }).then(res => {
                    if (res.ok) {
                        if (endpoint === "projekty") {
                            nactiProjekty();
                            if(document.getElementById("form-projekt-id").value == id) vynulujProjektFormular();
                        } else {
                            nactiOsoby();
                            nactiVsechnyOsobyProSelect();
                            nactiDynamickePozice(); // Aktualizace dynamického filtru po smazání role
                            if(document.getElementById("form-osoba-id").value == id) vynulujOsobuFormular();
                        }
                    }
                }).catch(err => console.error(err));
            }
        }

        function pripravUpravuProjektu(p) {
            document.getElementById("form-projekt-id").value = p.id;
            document.getElementById("form-projekt-nazev").value = p.nazev;
            document.getElementById("form-projekt-popis").value = p.popis || "";
            document.getElementById("form-projekt-start").value = p.start_date;
            document.getElementById("form-projekt-end").value = p.end_date || "";

            // Správné předvybrání stavu v rozbalovacím seznamu projektu
            const selectStav = document.getElementById("form-projekt-stav");
            for (let i = 0; i < selectStav.options.length; i++) {
                selectStav.options[i].selected = (selectStav.options[i].value === p.stav);
            }

            const selectClenove = document.getElementById("form-projekt-clenove");
            for (let i = 0; i < selectClenove.options.length; i++) selectClenove.options[i].selected = p.clenove.includes(parseInt(selectClenove.options[i].value));

            document.getElementById("karta-projektu-form").classList.add("card-edit-mode");
            document.getElementById("hlavicka-projektu-form").classList.add("header-edit-mode");
            document.getElementById("nadpis-projektu-form").innerText = `✏️ Úprava: ${p.nazev}`;
            document.getElementById("btn-submit-projekt").innerText = "Aktualizovat projekt";
            document.getElementById("btn-reset-projekt").style.display = "block";
            document.getElementById("karta-projektu-form").scrollIntoView({ behavior: 'smooth' });
        }

        function vynulujProjektFormular() {
            document.getElementById("projekt-html-form").reset(); document.getElementById("form-projekt-id").value = "";
            document.getElementById("karta-projektu-form").classList.remove("card-edit-mode");
            document.getElementById("hlavicka-projektu-form").classList.remove("header-edit-mode");
            document.getElementById("nadpis-projektu-form").innerText = "➕ Nový projekt";
            document.getElementById("btn-submit-projekt").innerText = "Uložit projekt";
            document.getElementById("btn-reset-projekt").style.display = "none";
            document.getElementById("error-project-box").style.display = "none";
        }

        function ulozProjekt(e) {
            e.preventDefault(); const id = document.getElementById("form-projekt-id").value;
            const box = document.getElementById("error-project-box"); box.style.display = "none";
            const sel = document.getElementById("form-projekt-clenove");

            // NOVÉ: Bezpečné ošetření prázdného výběru osob
            const vybraneOsoby = sel.selectedOptions.length > 0
                ? Array.from(sel.selectedOptions).map(o => parseInt(o.value))
                : []; // Pokud nikdo není vybrán, pošle se čisté prázdné pole

            const data = {
                nazev: document.getElementById("form-projekt-nazev").value,
                popis: document.getElementById("form-projekt-popis").value,
                start_date: document.getElementById("form-projekt-start").value,
                end_date: document.getElementById("form-projekt-end").value || null,
                stav: document.getElementById("form-projekt-stav").value,
                clenove: vybraneOsoby // <-- Použijeme ošetřenou proměnnou
            };

            fetch(id ? `${API_BASE}/projekty/${id}/` : `${API_BASE}/projekty/`, {
                method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
            }).then(async res => {
                const json = await res.json();
                if (res.ok) { nactiProjekty(); vynulujProjektFormular(); }
                else { box.innerHTML = `⚠️ ${json.end_date || (json.nazev ? 'Projekt s tímto názvem existuje.' : JSON.stringify(json))}`; box.style.display = "block"; }
            }).catch(err => console.error(err));
        }


        function pripravUpravuOsoby(o) {
            document.getElementById("form-osoba-id").value = o.id; document.getElementById("form-osoba-jmeno").value = o.jmeno;
            document.getElementById("form-osoba-prijmeni").value = o.prijmeni; document.getElementById("form-osoba-email").value = o.email;
            document.getElementById("form-osoba-pozice").value = o.pozice;
            document.getElementById("karta-osoby-form").classList.add("card-edit-mode");
            document.getElementById("hlavicka-osoby-form").classList.add("header-edit-mode");
            document.getElementById("nadpis-osoby-form").innerText = `✏️ Úprava: ${o.prijmeni}`;
            document.getElementById("btn-submit-osoba").innerText = "Aktualizovat";
            document.getElementById("btn-reset-osoba").style.display = "block";
            document.getElementById("karta-osoby-form").scrollIntoView({ behavior: 'smooth' });
        }

        function vynulujOsobuFormular() {
            document.getElementById("osoba-html-form").reset(); document.getElementById("form-osoba-id").value = "";
            document.getElementById("karta-osoby-form").classList.remove("card-edit-mode");
            document.getElementById("hlavicka-osoby-form").classList.remove("header-edit-mode");
            document.getElementById("nadpis-osoby-form").innerText = "➕ Nová osoba";
            document.getElementById("btn-submit-osoba").innerText = "Registrovat";
            document.getElementById("btn-reset-osoba").style.display = "none";
            document.getElementById("error-person-box").style.display = "none";
        }

        function ulozOsobu(e) {
            e.preventDefault(); const id = document.getElementById("form-osoba-id").value;
            const box = document.getElementById("error-person-box"); box.style.display = "none";
            const data = {
                jmeno: document.getElementById("form-osoba-jmeno").value,
                prijmeni: document.getElementById("form-osoba-prijmeni").value, email: document.getElementById("form-osoba-email").value,
                pozice: document.getElementById("form-osoba-pozice").value
            };
            fetch(id ? `${API_BASE}/osoby/${id}/` : `${API_BASE}/osoby/`, {
                method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
            }).then(async res => {
                const json = await res.json();
                if (res.ok) {
                    nactiOsoby();
                    nactiVsechnyOsobyProSelect();
                    nactiDynamickePozice(); // Aktualizace dynamického filtru po přidání/změně pozice
                    vynulujOsobuFormular();
                } else { box.innerHTML = `⚠️ ${json.email ? 'Tento e-mail již v registru existuje.' : JSON.stringify(json)}`; box.style.display = "block"; }
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
